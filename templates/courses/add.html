{#
  templates/courses/add.html -- Courses: the "Add a course" form.
#}
{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/courses.css') }}">
{% endblock %}

{% block content %}

<!-- Same back button as the course details page -->
<div class="back-bar">
    <a class="button-link button-secondary" href="{{ url_for('courses.courses') }}">&larr; Back to My Courses</a>
</div>

<!-- The form sits in a card instead of stretching across the page -->
<div class="form-card">
<h2>Add a Course</h2>

{% if error %}
<p class="error-message">{{ error }}</p>
{% endif %}

<form action="{{ url_for('courses.add_course') }}" method="POST" class="course-form">
    <label for="name">Course name</label>
    <input type="text" id="name" name="name" required>

    <label for="code">Course code</label>
    <input type="text" id="code" name="code" placeholder="e.g. CSCI 3300" value="{{ code or '' }}">

    <label for="instructor">Instructor</label>
    <input type="text" id="instructor" name="instructor" value="{{ instructor or '' }}">

    <div class="form-actions">
        <button type="submit">Add Course</button>
        <a class="button-link button-secondary" href="{{ url_for('courses.courses') }}">Cancel</a>
    </div>
</form>

</div>
{% endblock %}
