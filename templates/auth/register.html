{#
  templates/auth/register.html -- Create-account form.
#}
{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<h2>Create Account</h2>
<p class="auth-subtitle">It only takes a minute.</p>

{% if error %}
<p class="error-message">{{ error }}</p>
{% endif %}

<form method="POST">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>

    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <button type="submit">Create Account</button>
</form>

<p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
{% endblock %}
