{% extends "base.html" %}

{% block content %}

<h2>Add New Assignment</h2>

{% if error %}
    <p class="error-message">{{ error }}</p>
{% endif %}

<form method="POST">
    <label for="title">Assignment Name:</label>

    <input
        type="text"
        id="title"
        name="title"
        required
    >

    <button type="submit">Add Assignment</button>
</form>

{% endblock %}
