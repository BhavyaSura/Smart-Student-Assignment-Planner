
{# SSAP-24: Dashboard Schedule Widget #}

<section class="schedule-widget">
    <div class="section-header">
        <h3 class="section-title">Weekly Schedule</h3>
        <a href="{{ url_for('calendar.calendar') }}">
            View Calendar
        </a>
    </div>

    {% if schedule_preview %}
        <div class="schedule-list">
            {% for item in schedule_preview %}
                <div class="schedule-item">
                    <div class="schedule-date">
                        <strong>{{ item.day }}</strong>
                        <span>{{ item.date_label }}</span>
                    </div>

                    <div class="schedule-details">
                        <strong>{{ item.title }}</strong>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="schedule-empty">
            <p>Nothing scheduled for the next 7 days!</p>
            <p>You're all caught up.</p>
        </div>
    {% endif %}
</section>
